[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentos"
version = "0.1.0"
description = "Rebuilding software for AI agents — Service-as-Software execution platform. Agents are the operators; you delegate outcomes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentOS contributors" }]
keywords = ["ai-agents", "autonomous-agents", "service-as-software", "llm", "fastapi", "a2a"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Minimal core: everything needed to boot, plan deterministically, and serve.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7,<3",
    "httpx>=0.27",
    "typing-extensions>=4.11; python_version < '3.13'",
]

[project.optional-dependencies]
# Durable single-node / production state.
database = ["sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.20"]
postgres = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]
# Distributed task queue.
queue = ["celery>=5.4", "redis>=5.0"]
# Ephemeral context / pubsub.
redis = ["redis>=5.0"]
# Tracing.
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
agentos-server = "agentos.cli:serve"

[project.urls]
Homepage = "https://github.com/TheronEagle/agentos"
Documentation = "https://github.com/TheronEagle/agentos/tree/main/docs"
Issues = "https://github.com/TheronEagle/agentos/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
